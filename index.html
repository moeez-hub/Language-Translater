<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translator</title>
<link href="./output.css" rel="stylesheet">
</head>
<body class="bg-indigo-300">

<div class="flex justify-center items-center min-h-screen p-4">
<div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full">

<h1 class="text-2xl font-bold mb-6 text-center">Translator</h1>

<form id="translateForm">

<div class="mb-4">
<label for="fromLanguage" class="block text-gray-700 mb-1">Translate from</label>
<select name="sourceLanguage" id="fromLanguage"
class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:border-blue-300">
<option value="en">English</option>
<option value="es">Spanish</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="ur">Urdu</option>
</select>
</div>

<div class="mb-4">
<label for="tolanguage" class="block text-gray-700 mb-1">Translate into</label>
<select name="language" id="tolanguage"
class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring focus:border-blue-300">
<option value="en">English</option>
<option value="es">Spanish</option>
<option value="fr">French</option>
<option value="de">German</option>
<option value="ur">Urdu</option>
</select>
</div>

<div class="mb-4">
<label for="text" class="block text-gray-700 mb-1">Text to Translate</label>
<textarea name="text" id="text"
class="w-full px-3 py-2 h-60 border rounded-lg focus:outline-none focus:ring focus:border-blue-300"></textarea>
</div>
    <p id="networkError" class="text-red-500 hidden">Network error occurred. Please try again.</p>
<button id="translateBtn" type="submit"
class="w-full bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600 transition">
Translate
</button>
</form>

</div>
</div>
<script src="app.js"></script>
</body>
</html>
